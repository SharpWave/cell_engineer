<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flatland Evolution</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: monospace; color: #c8c8d4; }

    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }

    #left-panel {
      width: 220px;
      min-width: 220px;
      background: #12122a;
      border-right: 2px solid #2a2a4a;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #right-panel {
      width: 280px;
      min-width: 280px;
      background: #12122a;
      border-left: 2px solid #2a2a4a;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .panel-title {
      font-size: 14px;
      font-weight: bold;
      color: #e0c878;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #2a2a4a;
      padding-bottom: 8px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 0;
    }

    .stat-label { color: #8888a8; }
    .stat-value { color: #e8e8f0; }
    .stat-value.energy { color: #e0c878; font-weight: bold; }

    #inspector-content {
      font-size: 13px;
      line-height: 1.6;
    }

    .inspector-empty {
      color: #555570;
      font-style: italic;
      font-size: 12px;
    }

    .prop-section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #2a2a4a;
    }

    .prop-title {
      font-size: 12px;
      color: #e0c878;
      margin-bottom: 4px;
    }

    .eng-btn {
      display: block;
      width: 100%;
      margin: 4px 0;
      padding: 6px 10px;
      background: #1e1e3a;
      color: #c8c8d4;
      border: 1px solid #3a3a5a;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
    }
    .eng-btn:hover:not(:disabled) { background: #2a2a4a; border-color: #5a5a7a; }
    .eng-btn:disabled { opacity: 0.4; cursor: default; }

    .eng-select {
      background: #1e1e3a;
      color: #c8c8d4;
      border: 1px solid #3a3a5a;
      border-radius: 3px;
      font-family: monospace;
      font-size: 11px;
      padding: 3px 4px;
      max-width: 100px;
    }

    .eng-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #3a3a5a;
      border-radius: 2px;
      outline: none;
    }
    .eng-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      background: #e0c878;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-B0qCnuPW.js"></script>
</head>
<body>
  <div id="app">
    <div id="left-panel">
      <div class="panel-title">Controls</div>
      <div class="stat-row">
        <span class="stat-label">Carbs</span>
        <span class="stat-value" id="carbs-display" style="color:#ffd700; font-weight:bold">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Protein</span>
        <span class="stat-value" id="protein-display" style="color:#4a8aff; font-weight:bold">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Waste</span>
        <span class="stat-value" id="waste-display" style="color:#7a5c3a; font-weight:bold">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Cells</span>
        <span class="stat-value" id="cell-count">1</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Growth</span>
        <span class="stat-value" id="growth-display">1.00x</span>
      </div>
      <div class="prop-section">
        <div class="prop-title">Food Spawning</div>
        <div class="stat-row" style="align-items:center">
          <span class="stat-label" style="color:#ffd700">Carbs</span>
          <span style="display:flex;align-items:center;gap:4px">
            <input type="range" min="0" max="50" value="10" class="eng-slider" id="slider-carb-rate" style="width:60px">
            <span class="stat-value" id="val-carb-rate" style="width:24px;text-align:right">10</span>
            <button class="eng-btn" id="btn-spawn-carb" style="margin:0;padding:2px 6px;font-size:10px">+1</button>
          </span>
        </div>
        <div class="stat-row" style="align-items:center">
          <span class="stat-label" style="color:#4a8aff">Protein</span>
          <span style="display:flex;align-items:center;gap:4px">
            <input type="range" min="0" max="50" value="10" class="eng-slider" id="slider-mprotein-rate" style="width:60px">
            <span class="stat-value" id="val-mprotein-rate" style="width:24px;text-align:right">10</span>
            <button class="eng-btn" id="btn-spawn-mprotein" style="margin:0;padding:2px 6px;font-size:10px">+1</button>
          </span>
        </div>
        <div class="stat-row" style="align-items:center">
          <span class="stat-label" style="color:#7c4dff">Stat. Prot.</span>
          <span style="display:flex;align-items:center;gap:4px">
            <input type="range" min="0" max="50" value="0" class="eng-slider" id="slider-sprotein-rate" style="width:60px">
            <span class="stat-value" id="val-sprotein-rate" style="width:24px;text-align:right">0</span>
            <button class="eng-btn" id="btn-spawn-sprotein" style="margin:0;padding:2px 6px;font-size:10px">+1</button>
          </span>
        </div>
      </div>
      <div class="prop-section">
        <div class="prop-title">Simulation</div>
        <button class="eng-btn" id="btn-pause">Pause</button>
        <button class="eng-btn" id="btn-restart">Restart</button>
        <button class="eng-btn" id="btn-focus-next">Focus Next Cell</button>
      </div>
    </div>
    <div id="canvas-container">
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="right-panel">
      <div class="panel-title">Inspector</div>
      <div id="inspector-content">
        <span class="inspector-empty">Click a cell or food particle to inspect it.</span>
      </div>
    </div>
  </div>
</body>
</html>
